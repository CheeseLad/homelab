- resources:
    cpu: true
    memory: true
    disk: /

- search:
    provider: google
    target: _blank

- weatherapi:
    latitude: {{HOMEPAGE_VAR_LATITUDE}}
    longitude: {{HOMEPAGE_VAR_LONGITUDE}}
    provider: weatherapi
    units: metric

