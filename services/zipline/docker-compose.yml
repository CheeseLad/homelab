services:
  zipline-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: "zipline-postgres"
    environment:
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DATABASE
    networks:
      - cheeselab
    volumes:
      - ~/storage/zipline/pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DATABASE']
      interval: 10s
      timeout: 5s
      retries: 5

  zipline:
    image: ghcr.io/diced/zipline:latest
    restart: unless-stopped
    container_name: zipline
    ports:
      - "5000:3000"
    networks:
      - cheeselab
    environment:
      - DATABASE_URL=$DATABASE_URL
      - CORE_SECRET=$CORE_SECRET
      - CORE_HOSTNAME=0.0.0.0
      - CORE_PORT=3000
    volumes:
      - ~/storage/zipline/uploads:/zipline/uploads
      - ~/storage/zipline/public:/zipline/public
    depends_on:
      zipline-postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zipline.entrypoints=https"
      - "traefik.http.routers.zipline.rule=Host(`i.jakefarrell.ie`)"
      - "traefik.http.services.zipline.loadbalancer.server.port=3000"

networks:
  cheeselab:
    external: true